name: 'Install Nix'
description: 'Install Nix'
runs:
  using: 'composite'
  steps:
    # Multi-user (daemon) install: darwin-rebuild assumes NIX_REMOTE=daemon
    # and a system-wide profile, which single-user installs can't provide
    # for `sudo darwin-rebuild switch`.
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v22
      with:
        # Stock Nix, not the Determinate fork. Determinate Nix ships nixd,
        # which emits a build-events firehose that magic-nix-cache
        # subscribes to; that firehose fires for substituted paths too, so
        # upstream-cache exclusion never fires and the GHA cache gets
        # hammered with paths already on cache.nixos.org (hitting the
        # per-repo API rate limit mid-run). Stock Nix uses the classical
        # post-build-hook, which only fires for locally-built paths, so
        # substitutions from cache.nixos.org are naturally excluded.
        # Multi-user daemon install is still the installer default.
        determinate: false

    # Belt-and-suspenders: the installer already does this, but we don't
    # want to depend on that staying true.
    - name: Enable flakes system-wide (for sudo'd nix invocations)
      shell: bash
      run: |
        sudo mkdir -p /etc/nix
        echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf

    # Lower priority number = higher preference. Default cache.nixos.org
    # entry sits at ~40; magic-nix-cache's local proxy at ~30. Pinning
    # cache.nixos.org at 1 makes it strictly preferred, so the GHA-backed
    # cache only stores paths cache.nixos.org doesn't have (per-config
    # toplevel/activationPackage closures). No upstream nixpkgs duplication.
    - name: Prefer cache.nixos.org over GHA cache
      shell: bash
      run: |
        sudo mkdir -p /etc/nix
        echo "extra-substituters = https://cache.nixos.org?priority=1" | sudo tee -a /etc/nix/nix.conf

    # macOS runners: magic-nix-cache's post-build-hook path is unreliable on
    # the darwin daemon, so leave it off and let darwin builds rely on
    # cache.nixos.org alone. Linux runners still get GHA-cache uploads for
    # the per-config paths that cache.nixos.org doesn't have.
    - name: Magic Nix Cache
      if: runner.os != 'macOS'
      uses: DeterminateSystems/magic-nix-cache-action@v14
      with:
        # We're not a FlakeHub tenant; opt out explicitly so the action
        # doesn't log "Unable to authenticate to FlakeHub..." every run.
        use-flakehub: false
