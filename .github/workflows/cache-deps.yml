# Builds what CI compiles from source (flake package ci-cache's members:
# statix, plus odroid-image's u-boot on aarch64-linux) when the GHA cache
# lacks it, and uploads only those members' new paths. One leg per Linux
# arch a job runs on: lint and flake-check use x86_64, the build legs
# aarch64. Darwin is out of matrix -- magic-nix-cache is off there.
#
# The cache key is each member's output path, so a flake.lock bump that
# doesn't touch a member is a few narinfo lookups and no build. Config
# glue (etc files, units, image scripts) isn't cached: it isn't on
# cache.nixos.org, but it builds in seconds wherever it's needed. See
# scripts/cache-deps.
name: Cache dependencies
on:
  workflow_call:

permissions:
  contents: read

jobs:
  cache-deps:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            runs-on: ubuntu-latest
          - name: aarch64-linux
            runs-on: ubuntu-24.04-arm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    # A warm run is install + eval + a few lookups. When GHA throttles
    # magic-nix-cache mid-substitution, Nix can hang silently until the 6h
    # job limit (seen on odroid-image, PR #36); fail fast instead.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/install-nix
      - name: Build and cache missing members
        run: scripts/cache-deps "http://$MAGIC_NIX_CACHE_ADDRESS"
