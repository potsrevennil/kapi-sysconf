# Warms the GHA cache with per-config activation/toplevel closures for the
# Linux build targets, so the downstream build.yml legs are cache hits.
#
# Darwin targets are absent from this matrix on purpose: magic-nix-cache is
# gated off on macOS in the install-nix composite (post-build-hook is
# unreliable on the darwin daemon), so a darwin cache-deps leg would upload
# nothing and just burn runner minutes.
#
# Only paths cache.nixos.org doesn't have get uploaded, thanks to the
# priority=1 substituter pin in the install-nix composite -- upstream nixpkgs
# is fetched, not re-uploaded.
name: Cache dependencies
on:
  workflow_call:

permissions:
  contents: read

jobs:
  cache-deps:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home-manager (thing-hanlim, linux)
            target: homeConfigurations.thing-hanlim-linux.activationPackage
          - name: nixos (odroid)
            target: nixosConfigurations.nixos.config.system.build.toplevel
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/build-flake-target
        with:
          target: ${{ matrix.target }}
      - name: Push non-upstream paths to GHA cache
        run: scripts/nix-cache-upload ./result
