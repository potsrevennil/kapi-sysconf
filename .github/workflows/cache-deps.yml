# Warms the GHA cache with per-config Linux closures so downstream
# build legs cache-hit. Darwin is out of matrix -- magic-nix-cache is
# off there, so a darwin cache-deps would upload nothing.
name: Cache dependencies
on:
  workflow_call:

permissions:
  contents: read

jobs:
  cache-deps:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home-manager (thing-hanlim, linux)
            target: homeConfigurations.thing-hanlim-linux.activationPackage
          - name: nixos (odroid)
            target: nixosConfigurations.nixos.config.system.build.toplevel
          # odroid-image adds a patched u-boot cross-build and disko's
          # image-assembly derivations on top of the shared system closure --
          # heavy the first time, then substituted from GHA cache like the
          # other legs. Building the *diskoImagesScript* forces the full
          # closure (toplevel + disko-builder + kernel-modules-shrunk) without
          # running the script itself, which would need /dev/kvm for aarch64
          # guests (not exposed on GitHub's arm64 runners).
          - name: odroid-image (aarch64-linux)
            target: nixosConfigurations.odroid-image.config.system.build.diskoImagesScript
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/build-flake-target
        with:
          target: ${{ matrix.target }}
      - name: Push non-upstream paths to GHA cache
        run: scripts/nix-cache-upload ./result
