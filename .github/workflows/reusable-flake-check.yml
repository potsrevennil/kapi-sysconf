name: Reusable flake check

# Cheap eval-only pass across every declared system (aarch64-darwin,
# x86_64-darwin, aarch64-linux, x86_64-linux) -- catches syntax/option
# errors before the real builds spend runner time.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

jobs:
  flake-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/install-nix
      - run: nix flake check --all-systems
