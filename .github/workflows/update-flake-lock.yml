name: Update flake.lock

# Weekly cadence: fresh enough to catch security bumps without drowning
# review in churn. Manual dispatch for on-demand runs.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # TEMPORARY: end-to-end smoke test before merge. Remove before landing.
  push:
    branches: [ci/weekly-flake-lock-bump]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/install-nix
      # PAT (not the default GITHUB_TOKEN) so the bump PR fires the normal
      # on:pull_request trigger in ci.yml. GitHub's anti-recursion rule
      # suppresses workflow runs from events caused by GITHUB_TOKEN.
      - uses: DeterminateSystems/update-flake-lock@v28
        with:
          token: ${{ secrets.FLAKE_LOCK_PAT }}
          pr-title: 'chore(deps): weekly flake.lock bump'
