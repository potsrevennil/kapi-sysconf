name: Update flake.lock

# Weekly cadence: fresh enough to catch security bumps without drowning
# review in churn. Manual dispatch for on-demand runs.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.update.outputs.pull-request-operation }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-nix
      - uses: DeterminateSystems/update-flake-lock@v28
        id: update
        with:
          branch: update_flake_lock_action
          pr-title: 'chore(deps): weekly flake.lock bump'

  # Bump PRs opened by the default GITHUB_TOKEN don't fire on:pull_request,
  # so call the same reusable jobs ci.yml uses, against the bump branch.
  # Each caller job pins its own permissions ceiling so the write scope
  # this workflow needs for the update step doesn't leak into CI.
  lint:
    needs: update
    if: needs.update.outputs.operation == 'created' || needs.update.outputs.operation == 'updated'
    uses: ./.github/workflows/reusable-lint.yml
    with:
      ref: update_flake_lock_action
    permissions:
      contents: read

  flake-check:
    needs: update
    if: needs.update.outputs.operation == 'created' || needs.update.outputs.operation == 'updated'
    uses: ./.github/workflows/reusable-flake-check.yml
    with:
      ref: update_flake_lock_action
    permissions:
      contents: read

  build:
    needs: [update, flake-check]
    if: needs.update.outputs.operation == 'created' || needs.update.outputs.operation == 'updated'
    uses: ./.github/workflows/reusable-build.yml
    with:
      ref: update_flake_lock_action
    permissions:
      contents: read
