# Each job is a reusable workflow (uses:) rather than an inline job.
# Every job reads the GHA cache through magic-nix-cache; only the build
# legs with `cache: true` write to it (scripts/cache-deps), since each
# custom derivation is used by exactly one leg. See
# .github/actions/install-nix for the substituter setup.
#
# Nothing waits on anything: flake-check only evaluates, and a build leg
# builds or substitutes its own custom derivation, so a `needs` would
# only add wall-clock.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  flake-check:
    uses: ./.github/workflows/flake-check.yml

  build:
    uses: ./.github/workflows/build.yml
