# Each job is a reusable workflow (uses:) rather than an inline job. The
# indirection is deliberate: GHA-cache scoping treats reusable-workflow
# tokens as reads unless the caller explicitly grants write, which lets
# cache-deps be the sole writer and every other job a reader with no
# per-job configuration. See .github/actions/install-nix for the
# substituter-priority + magic-nix-cache setup that backs this.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-deps:
    uses: ./.github/workflows/cache-deps.yml

  lint:
    uses: ./.github/workflows/lint.yml

  flake-check:
    uses: ./.github/workflows/flake-check.yml

  build:
    needs: [cache-deps, flake-check]
    uses: ./.github/workflows/build.yml
