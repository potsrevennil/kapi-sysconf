name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each leg is its own reusable workflow so callers can pick the ones they
# need and scope permissions per-job. update-flake-lock.yml calls the same
# three against the bump branch.
jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml

  flake-check:
    uses: ./.github/workflows/reusable-flake-check.yml

  build:
    needs: flake-check
    uses: ./.github/workflows/reusable-build.yml
